name: Build Unsigned IPA

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npm run build || true

      - name: Setup Permissions, CocoaPods & Sync Capacitor
        run: |
          chmod -R +x node_modules/.bin
          npx cap add ios || true
          npx cap sync ios
          cd ios/App && pod install

      - name: Build Xcode Archive
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive -archivePath build/App.xcarchive

      - name: Export Unsigned IPA Package
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/App.xcarchive/Products/Applications/*.app build/ipa/Payload/
          cd build/ipa
          zip -r chitty-app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chitty-app-unsigned
          path: build/ipa/chitty-app.ipa