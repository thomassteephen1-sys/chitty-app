name: Build Unsigned IPA`n`non: [push, workflow_dispatch]`n`njobs:`n  build:`n    runs-on: macos-latest:`n    steps:`n      - uses: actions/checkout@v3`n      - uses: actions/setup-node@v3`n        with:`n          node-version: 18`n      - run: npm install`n      - run: npx cap add ios || true`n      - run: npx cap sync`n      - name: Build Xcode Archive`n        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO archive -archivePath build/App.xcarchive`n      - name: Package IPA`n        run: |`n          mkdir -p build/ipa/Payload`n          cp -r build/App.xcarchive/Products/Applications/App.app build/ipa/Payload/`n          cd build/ipa`n          zip -r chitty-app.ipa Payload`n      - name: Upload IPA Artifact`n        uses: actions/upload-artifact@v3`n        with:`n          name: chitty-app-unsigned`n          path: build/ipa/chitty-app.ipa
